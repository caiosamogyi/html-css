<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            color: red;
            background-color: black;
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>aaaaa</h1>
    <h2>bbbbbbb</h2>
    <p>Passe o mouse abaixo</p>
    <div>
        Passe o mouse aqui
        <p>ccccccccccc</p>
    </div>
    
</body>
</html>
