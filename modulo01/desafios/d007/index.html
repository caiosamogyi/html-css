<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Flexíveis</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>A imagem a seguir mudará de tamanho conforme disponibilidade de tela:</p>

    <picture>
        <source media="(max-width: 750px )" srcset="imagens/paisagem-p.png" sizes="application/png">
        <source media="(max-width: 1050px )" srcset="imagens/paisagem-m.png" sizes="application/png">
        <img src="imagens/paisagem-g.png" alt="">
    </picture>

</body>
</html>
